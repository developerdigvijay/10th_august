<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>

    <!-- this is external CSS which is always recommended to use -->
    <link rel="stylesheet" href="styles.css">

    <!-- thhis is internal css -->
    <style>
        h2 {
            font-family: cursive;
            background-color: black;
            color: whitesmoke;
        }
    </style>
</head>

<body>
    <!-- this is inline css -->
    <h1 style="color: rebeccapurple ">here we go with css</h1>

    <!-- internal css example -->
    <h2>example of internal css use case.</h2>

    <!-- external css example -->
    <h3>this is external css example</h3>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>

<body>
    <h1>Registration form</h1>
    <label for="full_name">Full name:</label>
    <input type="text" name="full_name" id="">
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="">
    <br>
    <br>
    <label for="password">Password:</label>
    <input type="password" name="password" id="">
    <br>
    <br>
    <label for="dob">Date of birth:</label>
    <input type="date" name="dob" id="">
    <br>
    <br>
    <label for="gender">Gender:</label>
    <input type="radio">Male
    <input type="radio">Female
    <br>
    <br>
    <label for="phone_number">Phone number:</label>
    <input type="number" name="phone_number" id="">
    <br><br>
    <label for="country">Country</label>
    <select name="country" id="">
        <option value="SELECT">--SELECT--</option>
        <option value="USA">USA</option>
        <option value="ALASKA">ALASKA</option>
        <option value="PERU">PERU</option>
    </select>
    <br><br>
    <label for="address">Address:</label>
    <textarea name="address" id="" placeholder="Enter your address"></textarea>
    <br><br>
    <p> <input type="checkbox" name="" id=""> I Accept all <a href="#">tearms & conditions.</a></p>
    <button type="submit">Submit</button>
</body>

</html>
